<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/health_monitoring.css') }}">
</head>
<style>
    body, html {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #e6acac; /* Updated background color */
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1em;
        background-color: #a47171;
        color: white;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin-right: 1em;
    }
    .navbar h1 {
            color: white;
            flex-grow: 1;
            text-align: center;
            margin: 0;
    }

    .container {
        position: relative;
        padding: 20px;
        text-align: center;
    }

    .navigation {
        position: absolute;
        top: 50%; /* Center vertically */
        font-size: 24px;
        cursor: pointer;
        transform: translateY(-50%);
    }

    .navigation.left {
        left: 10px;
    }

    .navigation.right {
        right: 10px;
    }

    h2 {
        color: #000;
        margin: 20px 0;
    }

    .thermometer {
        margin: 20px auto;
        display: inline-block;
        width: 80px;
        height: 80px;
    }

    .thermometer img {
        width: 100%;
        height: auto;
    }

    .temperature {
        font-size: 32px;
        color: #000;
        margin: 10px 0;
    }

    .description {
        color: #666;
        margin: 20px;
        font-size: 16px;
    }

    .toggle {
        margin: 20px;
    }

    .toggle input[type="checkbox"] {
        -webkit-appearance: none;
        appearance: none;
        width: 60px;
        height: 30px;
        background-color: #ccc;
        border-radius: 30px;
        position: relative;
        outline: none;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .toggle input[type="checkbox"]:checked {
        background-color: #4CAF50;
    }

    .toggle input[type="checkbox"]:before {
        content: '';
        position:absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background-color: white;
        top: 1px;
        left: 1px;
        transition: left 0.3s;
    }

    .toggle input[type="checkbox"]:checked:before {
        left: 31px;
    }

    .pagination {
        display: flex;
        justify-content: center;
        margin-top: 20px;
    }

    .dot {
        height: 10px;
        width: 10px;
        background-color: #bbb;
        border-radius: 50%;
        display: inline-block;
        margin: 0 5px;
    }

    .dot.active {
        background-color: #333;
    }

    .circle-container {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .circle-container img {
        z-index: 1;
    }

    .progress-ring {
        transform: rotate(-90deg);
        position: absolute;
    }

</style>
</head>
<body>
    <div class="navbar">
        <div onclick="main_page()">&#x3C;</div>
        <h1>Health Monitoring</h1>
    </div>
    <div class="container">
        <h2>Body Temperature</h2>
        
        <div class="navigation left" onclick="previousPage()">&#x3C;</div>
        <div class="circle-container">
            <svg width="200" height="200" class="progress-ring">
                <circle class="progress-ring__circle" stroke="green" stroke-width="4" fill="transparent" r="86" cx="100" cy="100"/>
            </svg>
            <img src="{{ url_for('static', filename='Images/thermometer.png') }}" alt="Thermometer" width="160" height="160">
        </div>
        <div class="navigation right" onclick="nextPage()">&#x3E;</div>
        <div class="temperature">{{ temperature }} °C</div>
        <p class="description">Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book.</p>
        
        <div class="toggle">
            <label for="show-more">Show More:</label>
            <input type="checkbox" id="show-more" onchange="handleToggleChange(this)">
        </div>

        <div class="pagination">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var source = new EventSource('/data_stream');
            source.onmessage = function(event) {
                var data = JSON.parse(event.data);
                updateProgress(parseFloat(data.temperature));
                document.querySelector('.temperature').textContent = data.temperature + "°C";
                document.querySelector('.description').textContent = "Last updated: " + data.date;
            };
        });

        document.addEventListener('DOMContentLoaded', function () {
            fetch('/get_latest_data')
                .then(response => response.json())
                .then(data => {
                    updateProgress(parseFloat(data.temperature));
                    document.querySelector('.temperature').textContent = data.temperature + "°C";
                    document.querySelector('.description').textContent = "Last updated: " + data.date;
                });
        });

        function updateProgress(temperature) {
            const circle = document.querySelector('.progress-ring__circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;

            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            const normalizedValue = (temperature - 30) / (40 - 30);  // Range normalization
            const offset = circumference - normalizedValue * circumference;
            circle.style.strokeDashoffset = offset;

            const red = Math.floor(normalizedValue * 255);
            const green = 255 - red;
            circle.style.stroke = `rgb(${red},${green},0)`;
        }

        function handleToggleChange(toggle) {
            if (toggle.checked) {
                window.location.href = '/health_monitoring SM'; 
            }
        }

        function main_page() {
            window.location.href = '/main_page';
        }

        function nextPage() {
            window.location.href = '/health_monitoring BP';
        }

        function previousPage() {
            window.location.href = '/health_monitoring HR';
        }

    </script>
</body>
</html>
