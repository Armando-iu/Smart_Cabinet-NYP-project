<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="habit_tracker.css">
</head>
<body>
    <div class="navbar">
        <a href="main_page.html"><button onclick="goBack()">&#x3C;</button></a>
        
        <h1>Habit Tracker</h1>
    </div>
    <div class="container">
        <h4>Iron</h4>
        <div class="item iron">
            <div class="circle-container">
                <svg width="200" height="200" class="progress-ring" data-value="5" data-min="0" data-max="20">
                    <circle class="progress-ring__circle" stroke="green" stroke-width="4" fill="transparent" r="86" cx="100" cy="100"/>
                </svg>
                <img src="/website & server/Images/calcium-icon.jpg" alt="" width="160" height="160">
            </div>
        </div>
        <p>9 mg</p>
        <div class="row">
            
            <div class="item calcium">
                <p>Calcium</p>
                <div class="circle-container">
                    <svg width="200" height="200" class="progress-ring" data-value="15" data-min="0" data-max="20">
                        <circle class="progress-ring__circle" stroke="green" stroke-width="4" fill="transparent" r="86" cx="100" cy="100"/>
                    </svg>
                    <img src="/website & server/Images/calcium-icon.jpg" alt="" width="160" height="160">
                </div>
                <p>1000 mg</p>
            </div>
            
            
            <div class="item vitamin">
                <p>Vitamin B12</p>
                <div class="circle-container">
                    <svg width="200" height="200" class="progress-ring" data-value="10" data-min="0" data-max="20">
                        <circle class="progress-ring__circle" stroke="green" stroke-width="4" fill="transparent" r="86" cx="100" cy="100"/>
                    </svg>
                    <img src="/website & server/Images/calcium-icon.jpg" alt="" width="160" height="160">
                </div>
                <p>2.4 mcg</p>
            </div>
            
        </div>
        <div class="toggle">
            <label for="show-more">Show More:</label>
            <input type="checkbox" id="show-more" onchange="handleToggleChange(this)">
        </div>
    </div>
    <script>
        function goBack() {
            window.history.back();
        }

        function handleToggleChange(toggle) {
            if (toggle.checked) {
                window.location.href = 'habit_tracker2.html'; // Redirect to another page when the toggle is checked
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const progressElements = document.querySelectorAll('.progress-ring');
            progressElements.forEach(element => {
                const value = parseInt(element.dataset.value);
                const min = parseInt(element.dataset.min);
                const max = parseInt(element.dataset.max);
                updateProgress(element, value, min, max);
            });
        });

        function updateProgress(svgElement, value, min, max) {
            const circle = svgElement.querySelector('.progress-ring__circle');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;

            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            const normalizedValue = (value - min) / (max - min);
            const offset = circumference - normalizedValue * circumference;
            circle.style.strokeDashoffset = offset;

            const red = Math.floor(normalizedValue * 255);
            const green = 255 - red;
            circle.style.stroke = `rgb(${red},${green},0)`;
        }
    </script>
</body>
</html>
