<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Report</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #DFF8E8; /* Light green background */
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1em;
        background-color: #a47171;
        color: white;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin-right: 1em;
    }
    .navbar h1 {
        color: white;
        flex-grow: 1;
        text-align: center;
        margin: 0;
    }

    .container {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .row {
        display: flex;
        justify-content: space-around;
        width: 100%;
    }

    .item {
        margin: 10px;
        text-align: center;
    }

    .icon {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        color: white;
        margin-bottom: 5px;
        position: relative;
    }

    .title {
        position: absolute;
        top: 10px;
        font-size: 12px;
        font-weight: bold;
    }

    .icon {
        background-color: #efd8d3;
    }
    .toggle {
        margin-top: 20px;
    }

    .toggle input[type="checkbox"] {
        -webkit-appearance: none;
        appearance: none;
        width: 40px;
        height: 20px;
        background-color: #ccc;
        border-radius: 20px;
        position: relative;
        outline: none;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .toggle input[type="checkbox"]:checked {
        background-color: #4CAF50;
    }

    .toggle input[type="checkbox"]:before {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background-color: white;
        top: 1px;
        left: 1px;
        transition: left 0.3s;
    }

    .toggle input[type="checkbox"]:checked:before {
        left: 21px;
    }


</style>
<div class="navbar">
    <div onclick="main_page()">&#x3C;</div>
    
    <h1>Health Report</h1>
</div>
<div class="container">
    <div >
        <div  class="icon"><img src="{{ url_for('static', filename='images/png-transparent-pdf-computer-icons-others-miscellaneous-text-rectangle.png') }}" alt="" width="160" height="160"></div>
    </div>
    <h4>view Report in PDF</h4>
    <div class="row">
        <div >
            <div onclick="doctor_comment()" class="icon"><img src="{{ url_for('static', filename='images/images.png') }}" alt="" width="160" height="160"></div>
            <h4>Share with you doctor</h4>
        </div>
        
        <div >
            <div class="icon"><img src="{{ url_for('static', filename='images/809627.png') }}" alt="" width="160" height="160"> </div>
            <h4>Doctor's Note</h4>
        </div>
        
    </div>

</div>
<script>
    function main_page() {
            window.location.href = '/main_page';
        }
    function doctor_comment() {
            window.location.href = '/doctor_comment';
        }

</script>
</body>
</html>
