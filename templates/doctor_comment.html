<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Advice</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .section {
            margin-bottom: 20px;
        }

        .section h2 {
            color: #555;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }

        .submit-section {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Share with your doctor</h1>
        <form id="advice-form" method="post" action="/submit_advice">
            <div class="section">
                <h2>Medications:</h2>
                <textarea name="cardiovascular" rows="4" maxlength="100" placeholder=" This includes all prescription and over-the-counter medications that the patient is taking, including vitamins and herbal supplements..."></textarea>
            </div>
            <div class="section">
                <h2>Immunizations</h2>
                <textarea name="glucose" rows="4" maxlength="100" placeholder="This includes a record of all the vaccinations the patient has received..."></textarea>
            </div>
            <div class="section">
                <h2>Social history</h2>
                <textarea name="diet" rows="4" maxlength="100" placeholder="This includes information about the patient's living situation, marital status, occupation, and stress levels..."></textarea>
            </div>
            <div class="section">
                <h2>Sleep</h2>
                <textarea name="excercise" rows="4" maxlength="100" placeholder="How many hours of sleep do you typically get per night? Do you have trouble falling asleep or staying asleep?"></textarea>
            </div>
            <div class="section">
                <h2>Exercise</h2>
                <textarea name="mental" rows="4" maxlength="100" placeholder="How often do you exercise? What type of exercise do you do? For how long?"></textarea>
            </div>
            <div class="section">
                <h2>Stress levels</h2>
                <textarea name="respiratory" rows="4" maxlength="100" placeholder="Do you feel stressed on a daily basis? How do you manage stress?"></textarea>
            </div>
            <div class="section">
                <h2>Alcohol and tobacco use</h2>
                <textarea name="digestive" rows="4" maxlength="100" placeholder="Do you drink alcohol? If so, how much and how often? Do you smoke?"></textarea>
            </div>
            <div class="section">
                <h2>Screen time</h2>
                <textarea name="bone" rows="4" maxlength="100" placeholder="How much time do you spend looking at screens each day (TV, computer, phone)?"></textarea>
            </div>
            <div class="submit-section">
                <button type="button" class="back-button" onclick="goBack()">Back</button>
                <button type="submit">Submit Advice</button>
            </div>
        </form>
    </div>
    <script>
        function goBack() {
            window.location.href = '';
        }

    </script>
</body>
</html>
